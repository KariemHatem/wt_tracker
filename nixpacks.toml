[phases.setup]
nixPkgs = ["nodejs_20"]
cmds = ["npm install -g pnpm@11.8.0"]

[phases.install]
cmds = ["pnpm install --no-frozen-lockfile --ignore-scripts"]

[phases.build]
cmds = ["pnpm --filter @workspace/api-server run build"]

[start]
cmd = "node --enable-source-maps ./artifacts/api-server/dist/index.mjs"